# Local development database only. Synthetic demo data; not a HIPAA-eligible deployment.
# Roles: POSTGRES_USER `postgres` is a superuser and is the owner/migration role (DATABASE_URL).
# The least-privilege app role `careflow_app` (APP_DATABASE_URL) is NOT created here: `pnpm db:migrate`
# creates it (migration 0002) and sets its LOGIN password from APP_DATABASE_URL. The image's default
# pg_hba uses scram-sha-256 for TCP connections, which works for both roles.
services:
  postgres:
    image: postgres:16-alpine
    container_name: careflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careflow
    ports:
      - "5432:5432"
    volumes:
      - careflow-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  careflow-pg:
