# CareFlow AI CI: lint, typecheck, unit/integration tests and Playwright E2E
# against a throwaway PostgreSQL 16 with the deterministic synthetic seed.
# No secrets are needed: the demo runs fully offline with no API keys.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure environment
        run: cp .env.example .env

      # ── Database setup ─────────────────────────────────────────────────
      # All role/database provisioning lives in this one step. Extend it here
      # (e.g. create a non-owner application role) rather than adding steps.
      - name: Database setup
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE careflow"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE careflow_test"
          pnpm db:migrate
          pnpm db:seed
      # ───────────────────────────────────────────────────────────────────

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @careflow/web exec playwright install --with-deps chromium

      - name: E2E (production build) incl. axe accessibility and CSP checks
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
